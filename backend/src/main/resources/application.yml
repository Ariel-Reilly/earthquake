server:
  port: 8080

spring:
  application:
    name: disasterguard-backend
  servlet:
    multipart:
      # 设备图像上传：默认 1MB 上限会把大部分相机照片直接挡在解析阶段
      # （抛 MaxUploadSizeExceededException，且尚未进入业务校验），
      # 因此放宽到 20MB，与 DeviceImageService 的体积校验保持一致。
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/disasterguard
    username: disasterguard
    password: CHANGE_ME__dev_postgres_password_2026
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: false
      encoding: UTF-8
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: CHANGE_ME__dev_redis_password_2026
      repositories:
        enabled: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  kotlin:
    enabled: false

# ================= AI 客户端配置 =================
# 强制开启，并指定 Python AI 服务地址
ai:
  enabled: true
  service-base-url: http://localhost:8001/api/ai
  timeout-ms: 30000
  scheduler-enabled: false
  forecast-horizon: 7
  forecast-cron: 0 0 2 * * *

disasterguard:
  frontend-origin: http://localhost:5173

  security:
    dev-users-enabled: true
    # 写死一个 32 位以上的加密密钥
    data-encryption-key: "a_very_secure_data_encryption_key_2026_!@#"

  # 阿里云号码认证服务配置（你的真实密钥，请确保不要将此文件提交到公开 Git）
  sms:
    enabled: true
    access-key-id: "LTAI5t8dAWGREiVCySxNjD7s"
    access-key-secret: "gSkBAurtlFafQbkuGW45nm5YP42meM"
    sign-name: "恒创联众"
    template-code: "100001"
    endpoint: dypnsapi.aliyuncs.com

  # JWT 配置，写死一个 60 多位的强随机密钥，解决 WeakKeyException
  jwt:
    secret: "this_is_a_very_secure_secret_key_for_disaster_guard_2026_!@#"
    expire: PT2H
    issuer: disasterguard

  file-base-url: http://localhost:19000

  weather:
    cache-enabled: true
    cache-ttl-seconds: 300
    proxy-enabled: true

  external-data:
    enabled: true
    timeout-seconds: 10
    cache-ttl-seconds: 300
    open-meteo-url: https://api.open-meteo.com/v1/forecast
    usgs-url: https://earthquake.usgs.gov/fdsnws/event/1/query
    open-elevation-url: https://api.open-elevation.com/api/v1/lookup
    enabled-sources: openmeteo,usgs,openelevation,gdacs,osm,gpm,smap,copernicus

  warning:
    rule-engine-enabled: true
    rule-engine-cron: "*/30 * * * * *"

  ai:
    # 图像识别客户端（ImageAnalysisListener 使用）
    # 单独配置而不复用 ai.service-base-url：Python 端 /detect-image 是独立路由，
    # 且允许把图像推理单独指向另一台实例（图像链路需要 GPU 时不必连带换掉全部分析服务）。
    image-service-url: http://127.0.0.1:8001/api/ai/detect-image
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

    comprehensive-scheduler-cron: "0 */5 * * * *"
    comprehensive-to-warning-cron: "0 */10 * * * *"
    comprehensive-to-warning-enabled: true
    device-health-scheduler-enabled: true
    device-health-scheduler-cron: "0 */5 * * * *"
    hazard-monitor-enabled: true
    hazard-monitor-interval-ms: 90000
    hazard-monitor-initial-delay-ms: 8000
    hazard-monitor-max-regions-per-tick: 200
    hazard-monitor-include-plain: false
    hazard-monitor-min-level: town
    hazard-monitor-min-risk-level: HIGH

  device:
    auth-strict-mode: false
    offline-threshold-minutes: 5
    offline-check-interval-seconds: 60
    metric-cleanup-enabled: true
    metric-retention-days: 30
    metric-cleanup-cron: "0 30 3 * * *"

  realtime:
    websocket-enabled: true
  ws:
    require-ticket: false
    ticket-ttl-seconds: 60

minio:
  endpoint: http://localhost:19000
  access-key: disasterguard
  secret-key: CHANGE_ME__dev_minio_password_24chars_minimum_2026
  bucket: disasterguard

emqx:
  mqtt-url: tcp://localhost:11883
  client-id: disasterguard-backend
  topic: disasterguard/+/data
  qos: 1
  enabled: false
  username: ""
  password: ""

tdengine:
  url: jdbc:TAOS-RS://localhost:16041/disasterguard
  username: root
  password: taosdata
  enabled: false

logging:
  file:
    name: logs/backend.log
  level:
    root: info
    org.springframework.web: info
    org.hibernate.SQL: warn