spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:geosentry}
    username: ${POSTGRES_USER:geosentry}
    password: ${POSTGRES_PASSWORD:geosentry123}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:redis123}

geosentry:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  file-base-url: ${FILE_BASE_URL:http://minio:9000}

ai:
  service-base-url: ${AI_SERVICE_BASE_URL:http://ai-service:8000/api/ai}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
  bucket: ${MINIO_BUCKET:geosentry}

emqx:
  mqtt-url: ${EMQX_MQTT_URL:tcp://emqx:1883}
  client-id: ${EMQX_CLIENT_ID:geosentry-backend}
  topic: ${EMQX_DATA_TOPIC:geohazard/+/data}
  qos: ${EMQX_DATA_QOS:1}
  enabled: ${EMQX_ENABLED:true}

tdengine:
  host: ${TDENGINE_HOST:tdengine}
  port: ${TDENGINE_PORT:6030}
