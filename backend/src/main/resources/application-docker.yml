spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:geosentry}
    username: ${POSTGRES_USER:geosentry}
    password: ${POSTGRES_PASSWORD:geosentry123}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:redis123}

geosentry:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  file-base-url: ${FILE_BASE_URL:http://minio:9000}
  external-data:
    enabled: ${EXTERNAL_DATA_ENABLED:true}
    timeout-seconds: ${EXTERNAL_DATA_TIMEOUT:10}
    cache-ttl-seconds: ${EXTERNAL_DATA_CACHE_TTL:300}
    open-meteo-url: ${OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
    usgs-url: ${USGS_FDSN_URL:https://earthquake.usgs.gov/fdsnws/event/1/query}
    open-elevation-url: ${OPEN_ELEVATION_URL:https://api.open-elevation.com/api/v1/lookup}
    enabled-sources: ${EXTERNAL_DATA_SOURCES:openmeteo,usgs,openelevation,gdacs,osm,gpm,smap,copernicus}

ai:
  service-base-url: ${AI_SERVICE_BASE_URL:http://ai-service:8000/api/ai}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
  bucket: ${MINIO_BUCKET:geosentry}

emqx:
  mqtt-url: ${EMQX_MQTT_URL:tcp://emqx:1883}
  client-id: ${EMQX_CLIENT_ID:geosentry-backend}
  topic: ${EMQX_DATA_TOPIC:geohazard/+/data}
  qos: ${EMQX_DATA_QOS:1}
  enabled: ${EMQX_ENABLED:true}

tdengine:
  url: ${TDENGINE_URL:jdbc:TAOS-RS://tdengine:6041/geohazard}
  username: ${TDENGINE_USERNAME:root}
  password: ${TDENGINE_PASSWORD:taosdata}
  enabled: ${TDENGINE_ENABLED:false}
