spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:disasterguard}
    username: ${POSTGRES_USER:disasterguard}
    # ⚠️ 生产环境必须通过环境变量 POSTGRES_PASSWORD 覆盖，默认禁用（prod profile 已强制要求）
    password: ${POSTGRES_PASSWORD:}
  data:
    redis:
      host: redis
      port: 6379
      # ⚠️ 生产环境必须通过环境变量 REDIS_PASSWORD 覆盖，默认禁用（prod profile 已强制要求）
      password: ${REDIS_PASSWORD:}

disasterguard:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  file-base-url: ${FILE_BASE_URL:http://minio:9000}
  external-data:
    enabled: ${EXTERNAL_DATA_ENABLED:true}
    timeout-seconds: ${EXTERNAL_DATA_TIMEOUT:10}
    cache-ttl-seconds: ${EXTERNAL_DATA_CACHE_TTL:300}
    open-meteo-url: ${OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
    usgs-url: ${USGS_FDSN_URL:https://earthquake.usgs.gov/fdsnws/event/1/query}
    open-elevation-url: ${OPEN_ELEVATION_URL:https://api.open-elevation.com/api/v1/lookup}
    enabled-sources: ${EXTERNAL_DATA_SOURCES:openmeteo,usgs,openelevation,gdacs,osm,gpm,smap,copernicus}

ai:
  service-base-url: ${AI_SERVICE_BASE_URL:http://ai-service:8001/api/ai}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  # ⚠️ 生产环境必须通过环境变量 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD 覆盖
  # MinIO 官方推荐使用 MINIO_ROOT_* 命名，Spring Boot 支持两种别名
  access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:disasterguard}}
  secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
  bucket: ${MINIO_BUCKET:disasterguard}

emqx:
  mqtt-url: ${EMQX_MQTT_URL:tcp://emqx:1883}
  client-id: ${EMQX_CLIENT_ID:disasterguard-backend}
  topic: ${EMQX_DATA_TOPIC:disasterguard/+/data}
  qos: ${EMQX_DATA_QOS:1}
  enabled: ${EMQX_ENABLED:true}

tdengine:
  url: ${TDENGINE_URL:jdbc:TAOS-RS://tdengine:6041/disasterguard}
  username: ${TDENGINE_USERNAME:root}
  password: ${TDENGINE_PASSWORD:taosdata}
  enabled: ${TDENGINE_ENABLED:false}
