name: CI

# ─────────────────────────────────────────────────────────────────────
# 触发条件：push / PR 到 main 与 develop 分支
# ─────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ─────────────────────────────────────────────────────────────────────
# 并发：在最新 run 尚未完成时取消同分支同 PR 的旧 run
# ─────────────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 前端：lint + format check + build
  # ───────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint (must pass with 0 errors)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Vite build
        run: npm run build

  # ───────────────────────────────────────────────────────────────────
  # 后端：clean compile（必须 clean，避免 target 中陈旧 class 掩盖错误）
  # ───────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Maven clean compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 关键：用 -B（非交互）+ -q（精简输出）+ clean（强制重编译）
      # 教训：本仓库历史上多次出现"增量 BUILD SUCCESS"实则掩盖了从未被
      # 修改过的文件的语法错误，必须 clean。
      - name: mvn clean compile
        run: mvn -B -q -DskipTests clean compile

      - name: mvn test-compile (含 test 源码)
        run: mvn -B -q -DskipTests test-compile

  # ───────────────────────────────────────────────────────────────────
  # AI 服务：Python 语法健全性检查
  # ───────────────────────────────────────────────────────────────────
  ai-service:
    name: AI Service (Python syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: AST 解析全部 .py 文件
        run: |
          python -c "
          import ast, pathlib, sys
          ok = True
          for p in pathlib.Path('app').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  print(f'SYNTAX ERROR: {p}: {e}', file=sys.stderr)
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: py_compile 全量（tests 目录也参与）
        run: |
          if [ -d tests ]; then
            find app tests -name '*.py' -print0 | xargs -0 python -m py_compile
          else
            find app -name '*.py' -print0 | xargs -0 python -m py_compile
          fi

  # ───────────────────────────────────────────────────────────────────
  # 架构审计（不通过则阻塞 merge）
  # ───────────────────────────────────────────────────────────────────
  audits:
    name: Architecture audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 后端 Controller 漏 import 注解扫描
        run: node scripts/audit/check-missing-imports.mjs

      - name: 后端 / 前端 接口孤儿对账
        run: node scripts/audit/check-endpoint-parity.mjs

      - name: 前端相对路径 import 断链扫描
        run: cd frontend && node ../scripts/fix/check-broken-imports.mjs
