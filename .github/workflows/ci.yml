name: CI

# ─────────────────────────────────────────────────────────────────────
# 触发条件：push / PR 到 main 与 develop 分支
# ─────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ─────────────────────────────────────────────────────────────────────
# 并发：在最新 run 尚未完成时取消同分支同 PR 的旧 run
# ─────────────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 前端：lint + format check + build
  # ───────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint (must pass with 0 errors)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Vite build
        run: npm run build

      # ── 设计令牌完整性门禁（2026-10-09 新增）─────────────────────────────
      # 背景：批量把 #hex 替换成 var(--token) 时，若脚本未排除「令牌定义行」，
      # 会写出 `--c-surface: var(--c-surface);`。按 CSS 规范这构成依赖环，
      # 该属性在 computed-value 阶段 guaranteed-invalid → 浅色主题全站掉色，
      # 而 build / lint 都不会报错。这条门禁专门挡这种情况。
      - name: Token integrity (self-reference / dependency cycle)
        run: npm run check:tokens

      # ⚠ 补上一个真实存在的门禁漏洞：eslint.config.js 只声明了 JS 的 files 段，
      #   没有 vue pattern，所以 `npm run lint` 会把全部 .vue 静默跳过（exit 0）。
      #   而 vite build 只编译路由可达的组件。两者叠加 ⇒ 未挂载的 .vue
      #   即使语法损坏也无人发现（本次就查出一个 IosTabBar.vue 的模板语法错误）。
      - name: Vue SFC integrity (all .vue compile)
        run: npm run check:sfc

      # 主题可读性审计：浅色/深色下的文字对比度，报告不阻断
      - name: Theme contrast report (informational)
        run: npm run check:a11y
        continue-on-error: true

      # 设计一致性体检：只报告不阻断（存量偏差已登记，用于观察收敛趋势）
      - name: Design consistency report (informational)
        run: npm run check:design
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────
  # 后端：clean compile（必须 clean，避免 target 中陈旧 class 掩盖错误）
  # ───────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Maven clean compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 关键：用 -B（非交互）+ -q（精简输出）+ clean（强制重编译）
      # 教训：本仓库历史上多次出现"增量 BUILD SUCCESS"实则掩盖了从未被
      # 修改过的文件的语法错误，必须 clean。
      - name: mvn clean compile
        run: mvn -B -q -DskipTests clean compile

      - name: mvn test-compile (含 test 源码)
        run: mvn -B -q -DskipTests test-compile

  # ───────────────────────────────────────────────────────────────────
  # AI 服务：Python 语法健全性检查
  # ───────────────────────────────────────────────────────────────────
  ai-service:
    name: AI Service (Python syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: AST 解析全部 .py 文件
        run: |
          python -c "
          import ast, pathlib, sys
          ok = True
          for p in pathlib.Path('app').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  print(f'SYNTAX ERROR: {p}: {e}', file=sys.stderr)
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: py_compile 全量（tests 目录也参与）
        run: |
          if [ -d tests ]; then
            find app tests -name '*.py' -print0 | xargs -0 python -m py_compile
          else
            find app -name '*.py' -print0 | xargs -0 python -m py_compile
          fi

  # ───────────────────────────────────────────────────────────────────
  # 架构审计（不通过则阻塞 merge）
  # ───────────────────────────────────────────────────────────────────
  audits:
    name: Architecture audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 后端 Controller 漏 import 注解扫描
        run: node scripts/audit/check-missing-imports.mjs

      - name: 后端 / 前端 接口孤儿对账（后端有、前端没调）
        run: node scripts/audit/check-endpoint-parity.mjs

      # 反向：前端调了、后端没有。2026-09-21 复审的 P0（POST /api/warnings
      # 后端缺失而向导页已上线）正是这类缺口，故补上这条门禁。
      # 存量缺口已登记在脚本顶部 KNOWN_GAPS，不会阻断；新增缺口才会失败。
      - name: 反向接口对账（前端调用、后端缺失）
        run: node scripts/audit/check-frontend-endpoints.mjs

      - name: 前端相对路径 import 断链扫描
        run: cd frontend && node ../scripts/fix/check-broken-imports.mjs

      - name: 前端 setInterval 定时器泄漏检查
        run: cd frontend && node scripts/audit/check-timer-leaks.mjs
