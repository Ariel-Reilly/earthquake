# =============================================================================
# DisasterGuard 生产模式 docker-compose 覆盖文件
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 主要变化：
#   1. backend 使用 Dockerfile.backend 多阶段构建（jar 镜像），不再 mount 源码
#   2. 所有安全敏感配置强制为 prod 严格默认值
#   3. 使用 SPRING_PROFILES_ACTIVE=prod（触发 ProductionConfigValidator）
#   4. 健康检查 + resource limit
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TDENGINE_JDBC_VERSION: ${TDENGINE_JDBC_VERSION:-3.3.0}
    image: disasterguard-backend:latest
    container_name: disasterguard-backend
    restart: unless-stopped
    working_dir: /app
    # 生产 profile：自动触发 ProductionConfigValidator + MinioCredentialValidator + JwtService 校验
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://disasterguard.example.com}
      # JWT_SECRET 必须通过环境变量注入；默认值仅用于本地快速启动校验
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      FILE_BASE_URL: ${FILE_BASE_URL:-http://minio:9000}
      # prod profile 已默认覆盖：DEV_USERS_ENABLED=false, DEVICE_AUTH_STRICT=true, WS_REQUIRE_TICKET=true
      DEV_USERS_ENABLED: "false"
      DEVICE_AUTH_STRICT: "true"
      WS_REQUIRE_TICKET: "true"
      # PostGIS
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-disasterguard}
      POSTGRES_USER: ${POSTGRES_USER:-disasterguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MinIO（prod 必须显式设置）
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # EMQX MQTT（prod 必须显式设置）
      EMQX_USERNAME: ${EMQX_USERNAME}
      EMQX_PASSWORD: ${EMQX_PASSWORD}
      EMQX_ENABLED: ${EMQX_ENABLED:-true}
      EMQX_MQTT_URL: tcp://emqx:1883
      # TDengine（可选）
      TDENGINE_ENABLED: ${TDENGINE_ENABLED:-false}
      TDENGINE_URL: jdbc:TAOS-RS://tdengine:6041/disasterguard
      TDENGINE_USERNAME: ${TDENGINE_USERNAME:-root}
      TDENGINE_PASSWORD: ${TDENGINE_PASSWORD:-taosdata}
      # AI 服务
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8000/api/ai}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_SCHEDULER_ENABLED: ${AI_SCHEDULER_ENABLED:-false}
      TZ: ${TZ:-Asia/Shanghai}
    # 移除 dev 模式的源码 volume 挂载（生产镜像已打包）
    volumes:
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      emqx:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_USE_BACKEND: "true"
        VITE_API_BASE_URL: /api
        VITE_WS_URL: /ws
        VITE_REALTIME_POLL_INTERVAL: "15000"
        VITE_PERSONNEL_POLL_INTERVAL: "30000"
        VITE_TDT_TOKEN: ${VITE_TDT_TOKEN:-}
        VITE_TDT_ATTRIBUTION: ${VITE_TDT_ATTRIBUTION:-地图数据}
    image: disasterguard-frontend:latest
    container_name: disasterguard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  backend_logs:
