# =============================================================================
# DisasterGuard 生产模式 docker-compose 覆盖文件
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 主要变化：
#   1. backend 使用 Dockerfile.backend 多阶段构建（jar 镜像），不再 mount 源码
#   2. 所有安全敏感配置强制为 prod 严格默认值
#   3. 使用 SPRING_PROFILES_ACTIVE=prod（触发 ProductionConfigValidator）
#   4. 健康检查 + resource limit
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 基础设施凭证覆盖
  # 原 dev 文件给 postgres/redis/minio 配了弱口令默认值，而 prod backend 读取的
  # 是另一组变量（且为空）。两者不一致会导致：服务用弱口令启动、后端却拿到空密码，
  # 表现为连接被拒或 healthcheck 永久失败（进而 backend 的 depends_on 永久阻塞）。
  # 这里让基础设施与 backend 共用同一组变量，并用 :? 实现缺失即 fail-fast。
  # ---------------------------------------------------------------------------
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disasterguard}
      POSTGRES_USER: ${POSTGRES_USER:-disasterguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产环境必须设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}

  redis:
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?生产环境必须设置 REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?生产环境必须设置 REDIS_PASSWORD}", "ping"]

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-disasterguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?生产环境必须设置 MINIO_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TDENGINE_JDBC_VERSION: ${TDENGINE_JDBC_VERSION:-3.3.0}
    image: disasterguard-backend:latest
    container_name: disasterguard-backend
    restart: unless-stopped
    working_dir: /app
    # 生产 profile：自动触发 ProductionConfigValidator + MinioCredentialValidator + JwtService 校验
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://disasterguard.example.com}
      # JWT_SECRET 必须通过环境变量注入。用 :? 让缺失在 compose 解析阶段就失败，
      # 而不是等容器起来后由 JwtService 抛栈（application.yml 的 `secret: ${JWT_SECRET:}`
      # 展开是空串，没有任何兜底默认值）。
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置 JWT_SECRET（生成：openssl rand -base64 48）}
      # ISO 8601 Duration 格式。原先这里写 JWT_EXPIRE_MINUTES，但 Java 侧无任何引用，
      # 真正的键是 JWT_EXPIRE（application.yml: `${JWT_EXPIRE:PT2H}`）—— 属死配置，R4 顺带清理。
      JWT_EXPIRE: ${JWT_EXPIRE:-PT2H}
      FILE_BASE_URL: ${FILE_BASE_URL:-http://minio:9000}
      # prod profile 已默认覆盖：DEV_USERS_ENABLED=false, DEVICE_AUTH_STRICT=true, WS_REQUIRE_TICKET=true
      DEV_USERS_ENABLED: "false"
      DEVICE_AUTH_STRICT: "true"
      WS_REQUIRE_TICKET: "true"
      # PostGIS
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-disasterguard}
      POSTGRES_USER: ${POSTGRES_USER:-disasterguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产环境必须设置 POSTGRES_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?生产环境必须设置 REDIS_PASSWORD}
      # MinIO：必须与上方 minio 服务的 MINIO_ROOT_* 同源。
      # 若后端用一套凭证、MinIO 服务端用另一套，连接必然被 403 拒绝。
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-disasterguard}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?生产环境必须设置 MINIO_ROOT_PASSWORD}
      # ⚠️ R4 P0-4：此处原先**没有** MINIO_ENDPOINT，于是 minio.endpoint 回落到
      #   application.yml 的 `http://localhost:19000` —— 容器内指向自己，上传直接连接被拒。
      #   （application-prod.yml 是独立加载的，不含 application-docker.yml 的 minio:9000。）
      # 该值同时被 AttachmentService 用于生成 **presigned URL**，即浏览器要直接访问的地址，
      # 所以生产必须填「客户端也能解析」的公开地址（如 https://minio.example.com），
      # 而不是内网服务名 minio:9000 —— 否则上传能通、点开附件却打不开。
      # ProductionConfigValidator 会在 prod 启动时校验这一点。
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?生产环境必须设置 MINIO_ENDPOINT（须为客户端可达地址，如 https://minio.example.com）}
      # EMQX MQTT（prod 必须显式设置）
      # ⚠ R3 发现：本文件仅定义 postgres/redis/minio/backend/frontend 五个服务，
      #   **没有 emqx 也没有 ai-service**，但下面却引用了 tcp://emqx:1883 与
      #   http://ai-service:8001/api/ai —— 两个悬空主机名，Docker 网络内无法解析，
      #   生产环境 MQTT 与全部 AI 能力不可用。
      #   部署前必须：① 在本文件补 emqx / ai-service 服务定义，
      #   ② 或把 EMQX_ENABLED / AI_ENABLED 置为 false 显式关闭。
      EMQX_USERNAME: ${EMQX_USERNAME}
      EMQX_PASSWORD: ${EMQX_PASSWORD}
      EMQX_ENABLED: ${EMQX_ENABLED:-true}
      EMQX_MQTT_URL: tcp://emqx:1883
      # TDengine（可选）
      TDENGINE_ENABLED: ${TDENGINE_ENABLED:-false}
      TDENGINE_URL: jdbc:TAOS-RS://tdengine:6041/disasterguard
      TDENGINE_USERNAME: ${TDENGINE_USERNAME:-root}
      TDENGINE_PASSWORD: ${TDENGINE_PASSWORD:-taosdata}
      # AI 服务
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8001/api/ai}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_SCHEDULER_ENABLED: ${AI_SCHEDULER_ENABLED:-false}
      TZ: ${TZ:-Asia/Shanghai}
    # 移除 dev 模式的源码 volume 挂载（生产镜像已打包）
    volumes:
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      emqx:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_USE_BACKEND: "true"
        VITE_API_BASE_URL: /api
        VITE_WS_URL: /ws
        VITE_REALTIME_POLL_INTERVAL: "15000"
        VITE_PERSONNEL_POLL_INTERVAL: "30000"
        VITE_TDT_TOKEN: ${VITE_TDT_TOKEN:-}
        VITE_TDT_ATTRIBUTION: ${VITE_TDT_ATTRIBUTION:-地图数据}
    image: disasterguard-frontend:latest
    container_name: disasterguard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  backend_logs:
