# =============================================================================
# DisasterGuard 生产模式 docker-compose 覆盖文件
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 主要变化：
#   1. backend 使用 backend/Dockerfile 多阶段构建（jar 镜像），不再 mount 源码
#   2. 所有安全敏感配置强制为 prod 严格默认值
#   3. 使用 SPRING_PROFILES_ACTIVE=prod（触发 ProductionConfigValidator）
#   4. 健康检查 + resource limit
#   5. 补全 emqx / ai-service 服务定义 —— 此前 backend 引用了 tcp://emqx:1883 与
#      http://ai-service:8001/api/ai 两个不存在的主机名，MQTT 与 AI 链路在生产环境
#      全部不可用；现两者与其余服务共用 disasterguard-net，可按服务名互相解析。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 基础设施凭证覆盖
  # 原 dev 文件给 postgres/redis/minio 配了弱口令默认值，而 prod backend 读取的
  # 是另一组变量（且为空）。两者不一致会导致：服务用弱口令启动、后端却拿到空密码，
  # 表现为连接被拒或 healthcheck 永久失败（进而 backend 的 depends_on 永久阻塞）。
  # 这里让基础设施与 backend 共用同一组变量，并用 :? 实现缺失即 fail-fast。
  # ---------------------------------------------------------------------------
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disasterguard}
      POSTGRES_USER: ${POSTGRES_USER:-disasterguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产环境必须设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}

  redis:
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?生产环境必须设置 REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?生产环境必须设置 REDIS_PASSWORD}", "ping"]

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-disasterguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?生产环境必须设置 MINIO_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}

  # ---------------------------------------------------------------------------
  # EMQX：MQTT Broker（硬件/网关数据上行入口）
  # 与 dev 文件保持**同一镜像 + 同一 init.sh 挂载**：该脚本在 EMQX 5.9.0 上会探测
  # `emqx ctl` 是否支持 authn，不支持则直通启动 broker（详见 infra/emqx/init.sh 头部
  # 注释）。换镜像或改写启动命令都会让这段降级逻辑失效，进而容器起不来。
  #
  # ⚠️ 安全边界现状（R10 P1-1 之后）
  #   5.9.0 的 `emqx ctl` 没有 authn 子命令，因此认证改由 init.sh 用**声明式环境变量
  #   + 引导文件**开启（EMQX_AUTHENTICATION__1__*，R4 已在独立容器实测有效）：
  #     · 匿名连接被拒绝        · 错密码被拒绝        · 正确凭据收发正常
  #   下面这组 EMQX_USERNAME / EMQX_PASSWORD 现在**是真实生效的**，
  #   backend / 沙盘网关必须持有同一组值，否则连不上 broker。
  #
  #   ⚠️ 仍未做 ACL（authorization.sources 不能用环境变量表达，只设 TYPE 会因缺 path
  #      导致 broker 启动失败）：所有设备共用同一个 MQTT 账号，因此**认证解决了
  #      "匿名伪造数据"，但没有解决"任意持证设备越权发布"**。
  #      上生产前仍需补 ACL（挂 emqx.conf / cluster.hocon 或走 REST API）。
  #      在此之前务必保证 1883/8883 不对公网开放（本文件已默认只绑 127.0.0.1）。
  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.9.0
    container_name: disasterguard-emqx
    restart: unless-stopped
    environment:
      # 节点名与 cookie 决定集群身份，多副本部署时不能用默认值。
      EMQX_NODE_NAME: ${EMQX_NODE_NAME:-emqx@127.0.0.1}
      # 以下三项都用 :? 强制注入，与 postgres/redis/minio/JWT 保持一致：
      # 旧写法带 CHANGE_ME 默认兜底，照抄 .env.example 部署会静默使用公开凭据。
      EMQX_NODE_COOKIE: ${EMQX_NODE_COOKIE:?生产环境必须设置 EMQX_NODE_COOKIE}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?生产环境必须设置 EMQX_DASHBOARD_PASSWORD}
      # 认证由 init.sh 在启动时写入引导文件并导出 EMQX_AUTHENTICATION__1__*；
      # 这两项是 init.sh 的数据来源，必须与 backend 的 EMQX_USERNAME / EMQX_PASSWORD 同源。
      EMQX_USERNAME: ${EMQX_USERNAME:-disasterguard_backend}
      EMQX_PASSWORD: ${EMQX_PASSWORD:?生产环境必须设置 EMQX_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    # 必须用 init.sh 启动：它负责建认证用户/ACL 后 exec broker（PID 1，可正常收 SIGTERM）
    command: ["bash", "/opt/emqx/data/config/init.sh"]
    volumes:
      # 具名卷承接 broker 数据/日志，避免重启丢会话与持久化订阅。
      # ⚠ 注意：init.sh 挂在 /opt/emqx/data/config 上，具名卷挂在 /opt/emqx/data，
      #   两者是父子目录，compose 会按路径长度先挂 data 再挂 config，config 覆盖生效。
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./infra/emqx:/opt/emqx/data/config:ro
    # 容器间互通走 emqx:1883，宿主端口默认只绑回环，避免 MQTT 直接暴露公网。
    # 若设备需从外网直连，请改成 1883:1883 并配合防火墙/证书（8883）。
    ports:
      - "${EMQX_MQTT_HOST_PORT:-127.0.0.1:11883}:1883"
      - "${EMQX_MQTTS_HOST_PORT:-127.0.0.1:18883}:8883"
      - "${EMQX_WS_HOST_PORT:-127.0.0.1:18083}:8083"
      - "${EMQX_HTTP_HOST_PORT:-127.0.0.1:28083}:18083"
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      # init.sh 要先起 broker 再建用户，冷启动比普通镜像慢，start_period 给足。
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TDENGINE_JDBC_VERSION: ${TDENGINE_JDBC_VERSION:-3.3.0}
    image: disasterguard-backend:latest
    container_name: disasterguard-backend
    restart: unless-stopped
    working_dir: /app
    # 生产 profile：自动触发 ProductionConfigValidator + MinioCredentialValidator + JwtService 校验
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8080}
      # 现阶段投递白名单：留空时任何对外投递都会被 BLOCKED，生产不得擅自放宽。
      NOTIFICATION_TEST_RECIPIENTS: ${NOTIFICATION_TEST_RECIPIENTS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://disasterguard.example.com}
      # JWT_SECRET 必须通过环境变量注入。用 :? 让缺失在 compose 解析阶段就失败，
      # 而不是等容器起来后由 JwtService 抛栈（application.yml 的 `secret: ${JWT_SECRET:}`
      # 展开是空串，没有任何兜底默认值）。
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置 JWT_SECRET（生成：openssl rand -base64 48）}
      # ISO 8601 Duration 格式。原先这里写 JWT_EXPIRE_MINUTES，但 Java 侧无任何引用，
      # 真正的键是 JWT_EXPIRE（application.yml: `${JWT_EXPIRE:PT2H}`）—— 属死配置，R4 顺带清理。
      JWT_EXPIRE: ${JWT_EXPIRE:-PT2H}
      # 注册申请的身份证号加密密钥（AES-256-GCM）。同样用 :? 让缺失在 compose 解析阶段失败 ——
      # 否则容器能起来，但 ProductionConfigValidator 会在 @PostConstruct 抛栈，
      # 且留空时 SensitiveDataCipher 会生成一次性随机密钥，历史密文永久不可解。
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?生产环境必须设置 DATA_ENCRYPTION_KEY（生成：openssl rand -base64 32）}
      # 注册短信/邮箱验证码下发开关。网关尚未接入，保持 false —— 置 true 会被
      # ProductionConfigValidator 阻断（当前 SmsSender/EmailSender 仍是 Mock）。
      REGISTER_SMS_ENABLED: ${REGISTER_SMS_ENABLED:-false}
      REGISTER_EMAIL_ENABLED: ${REGISTER_EMAIL_ENABLED:-false}
      # ⚠️ 刻意不读 ${FILE_BASE_URL}：根目录 .env 里它是 http://localhost:19000
      #   （宿主机直跑用），注入 prod 容器会让附件链接指向用户本机。
      #   默认 minio:9000 只能容器间解析，浏览器打不开附件。部署时把
      #   MINIO_PUBLIC_URL 设为浏览器可达的公网地址（https://minio.example.com），
      #   并把 MINIO_ENDPOINT_PROD 设为同一地址、把该域名加入下方 ai-service 的
      #   DETECT_IMAGE_ALLOWED_HOSTS，三者需成对修改。
      FILE_BASE_URL: ${MINIO_PUBLIC_URL:-http://minio:9000}
      # prod profile 已默认覆盖：DEV_USERS_ENABLED=false, DEVICE_AUTH_STRICT=true, WS_REQUIRE_TICKET=true
      DEV_USERS_ENABLED: "false"
      DEVICE_AUTH_STRICT: "true"
      WS_REQUIRE_TICKET: "true"
      # PostGIS
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-disasterguard}
      POSTGRES_USER: ${POSTGRES_USER:-disasterguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产环境必须设置 POSTGRES_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?生产环境必须设置 REDIS_PASSWORD}
      # MinIO：必须与上方 minio 服务的 MINIO_ROOT_* 同源。
      # 若后端用一套凭证、MinIO 服务端用另一套，连接必然被 403 拒绝。
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-disasterguard}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?生产环境必须设置 MINIO_ROOT_PASSWORD}
      # ⚠️ 这里刻意**不读** ${MINIO_ENDPOINT}：根目录 .env 里它是 http://127.0.0.1:19000，
      #   那是给宿主机直跑 `mvn spring-boot:run` 用的。放进容器后 127.0.0.1 指向 backend
      #   自身，ProductionConfigValidator 会直接判定「MINIO_ENDPOINT 指向本机」并阻断启动。
      #   所以改用独立键 MINIO_ENDPOINT_PROD，默认走容器网络内的服务名，与 FILE_BASE_URL 一致。
      # ⚠️ 该值同时被 AttachmentService 用于生成 presigned URL，其 host 会原样出现在返回给
      #   浏览器的链接里。留 minio:9000 时：容器间上传/下载（含 AI 图像下载）全部正常，
      #   但宿主机浏览器打不开附件链接（minio 不可解析）。
      #   需要浏览器也能直接打开附件时，把 MINIO_ENDPOINT_PROD 改成公网域名（如
      #   https://minio.example.com），并同步把该域名加入 ai-service 的 DETECT_IMAGE_ALLOWED_HOSTS。
      MINIO_ENDPOINT: ${MINIO_ENDPOINT_PROD:-http://minio:9000}
      # EMQX MQTT：emqx 服务已在本文件定义，容器间经 disasterguard-net 用服务名解析。
      # 用户名/密码必须与 emqx 服务的 EMQX_USERNAME / EMQX_PASSWORD 同源 ——
      # infra/emqx/init.sh 用同一组值创建认证用户，不一致会导致 MQTT 鉴权失败。
      EMQX_USERNAME: ${EMQX_USERNAME:-disasterguard_backend}
      # 用 :? 强制注入：原默认值 CHANGE_ME_emqx_secure_password_2024 未被
      # ProductionConfigValidator 的黑名单命中，照抄默认值能启动却等于公开口令。
      EMQX_PASSWORD: ${EMQX_PASSWORD:?生产环境必须设置 EMQX_PASSWORD}
      EMQX_ENABLED: ${EMQX_ENABLED:-true}
      # 必须用容器网络内的服务名，不能写 localhost —— 那会指向 backend 容器自己。
      EMQX_MQTT_URL: tcp://emqx:1883
      # TDengine（可选）
      TDENGINE_ENABLED: ${TDENGINE_ENABLED:-false}
      TDENGINE_URL: jdbc:TAOS-RS://tdengine:6041/disasterguard
      TDENGINE_USERNAME: ${TDENGINE_USERNAME:-root}
      TDENGINE_PASSWORD: ${TDENGINE_PASSWORD:-taosdata}
      # AI 服务（ai-service 已在下方定义，同一网络内用服务名访问）
      # ⚠ 刻意不读 ${AI_SERVICE_BASE_URL}：根目录 .env 给的是
      #   http://localhost:8001/api/ai（宿主机直跑用），注入容器后 localhost 指向
      #   backend 自身，AI 链路会静默中断。生产固定在容器网络内用服务名解析。
      AI_SERVICE_BASE_URL: http://ai-service:8001/api/ai
      # 图像识别是独立配置项（AiImageProperties.imageServiceUrl），同上必须用服务名，
      # 否则会回落到 application.yml 的 127.0.0.1:8001 而连接被拒。
      AI_IMAGE_SERVICE_URL: http://ai-service:8001/api/ai/detect-image
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_SCHEDULER_ENABLED: ${AI_SCHEDULER_ENABLED:-false}
      TZ: ${TZ:-Asia/Shanghai}
    # 移除 dev 模式的源码 volume 挂载（生产镜像已打包）
    # ⚠ 必须用 !override 整段替换：基础文件给 backend 挂了 `./:/app`，而 compose 对
    #   volumes 是**按容器路径追加合并**，仅写 `- backend_logs:/app/logs` 不会删掉它。
    #   残留后果：宿主仓库覆盖镜像的 /app，镜像里的 /app/app.jar 被遮蔽，
    #   ENTRYPOINT 的 `java -cp /app/app.jar:...` 直接 ClassNotFoundException。
    #   顺带去掉 m2_cache（生产镜像不跑 mvn，缓存卷无意义）。
    volumes: !override
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      emqx:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # AI 服务（FastAPI + YOLO/ONNX 推理 + 多模型融合）
  # 刻意不让 backend 依赖本服务：AI 不可用时 backend 的图像识别会记录告警并跳过，
  # 属于可降级能力。若加 service_healthy 依赖，AI 冷启动慢会连带把 backend 拖死。
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: disasterguard-ai:latest
    container_name: disasterguard-ai
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # AI 只被 backend 以服务端 HTTP 调用，浏览器不直连，因此 CORS 实际不参与链路；
      # 保持与代码内回落值一致的安全默认（禁止 "*"）。若前端要直连 8001，再填前端域名。
      AI_CORS_ORIGINS: ${AI_CORS_ORIGINS:-http://localhost:5173}
      DETECT_TIMEOUT_SECONDS: ${DETECT_TIMEOUT_SECONDS:-30}
      DETECT_IMAGE_TIMEOUT_SECONDS: ${DETECT_IMAGE_TIMEOUT_SECONDS:-10}
      # SSRF 白名单：detect-image 是**按 backend 给的 presigned URL 下载图片**，而该 URL 的
      # 主机名就等于 backend 的 MINIO_ENDPOINT（上方 MINIO_ENDPOINT_PROD）。
      # 注意：本服务不消费 MINIO_ENDPOINT 变量，只认这个白名单 —— 两边必须成对修改。
      # 当前默认值 minio / minio:9000 已覆盖 MINIO_ENDPOINT_PROD 的默认值；
      # 若把端点改成公网域名（如 https://minio.example.com），必须在此追加该域名，
      # 否则图像识别会被 403 拒绝，表现是「检测静默跳过、日志只有一条 warn」。
      DETECT_IMAGE_ALLOWED_HOSTS: ${DETECT_IMAGE_ALLOWED_HOSTS:-minio,minio:9000,host.docker.internal}
    # 用 !override 整个替换而不是追加：基础文件里 ai-service 挂着 `./ai-service:/app`
    # （dev 的源码热更新用法），追加语义下它会保留并把**镜像内代码整个遮蔽**，
    # 生产构建就形同虚设。这里只保留模型目录，代码一律用镜像内的。
    volumes: !override
      # 权重不打进镜像（ai-service/Dockerfile 只 COPY app），必须由宿主机提供：
      # 缺失时检测器进入 mock 模式（mock:true），链路能跑通但无真实推理结果。
      - ./ai-service/models:/app/models:ro
    # 仅回环暴露，供宿主机 curl 自检；容器间访问走 ai-service:8001。
    ports:
      - "${AI_HOST_PORT:-127.0.0.1:8001}:8001"
    # 复用镜像内置 HEALTHCHECK（python 直连 /api/ai/health），此处不再重复声明，
    # 避免与 Dockerfile 的端口/路径约定出现两份不同步的定义。
    extra_hosts:
      # 便于 MINIO_ENDPOINT 指向宿主机（如 http://host.docker.internal:19000）时也能下载
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_USE_BACKEND: "true"
        VITE_API_BASE_URL: /api
        # 必须注入：前端源码的兜底值是 http://localhost:8001/api/ai，
        # 不注入会让生产浏览器请求用户本机 8001（AI 能力全断）。
        # 走 infra/nginx/frontend.conf 的 /ai-service/ 同源反代，避免 CORS 与端口暴露。
        VITE_AI_SERVICE_BASE: /ai-service/api/ai
        VITE_WS_URL: /ws
        VITE_REALTIME_POLL_INTERVAL: "15000"
        VITE_PERSONNEL_POLL_INTERVAL: "30000"
        VITE_TDT_TOKEN: ${VITE_TDT_TOKEN:-}
        VITE_TDT_ATTRIBUTION: ${VITE_TDT_ATTRIBUTION:-地图数据}
    image: disasterguard-frontend:latest
    container_name: disasterguard-frontend
    restart: unless-stopped
    # nginx 在加载配置时就会解析 proxy_pass 里的静态主机名；backend / ai-service
    # 尚未创建时会出现 `host not found in upstream` 并导致前端容器反复重启。
    # 这里只要求 started（不等 healthy），避免 AI 冷启动拖慢前端启动。
    depends_on:
      backend:
        condition: service_started
      ai-service:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  backend_logs:
  # EMQX 持久化：broker 数据（会话/保留消息）与日志分开存放，便于单独扩容与清理。
  emqx_data:
  emqx_log:

# 显式钉住网络名，与 dev 文件保持一致：
# 用两个 -f 合并时同名覆盖、不会各自新建网络；只跑本文件时也仍然是 disasterguard-net。
# 正因如此，backend 里的 emqx:1883 / ai-service:8001 才能解析到对应容器。
networks:
  default:
    name: disasterguard-net
