<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DisasterGuard 混合沙盘 — 实景渲染</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden;font-family:system-ui,'Microsoft YaHei',sans-serif}
#canvas-container{width:100vw;height:100vh;position:relative}
#info-overlay{position:absolute;top:16px;left:16px;z-index:10;background:rgba(10,10,25,0.88);
  color:#d0d0e0;padding:16px 20px;border-radius:12px;backdrop-filter:blur(10px);
  border:1px solid rgba(100,181,246,0.15);max-width:360px;font-size:13px;line-height:1.6}
#info-overlay h2{font-size:18px;margin-bottom:8px;color:#64B5F6}
#info-overlay .zone{display:flex;align-items:center;gap:8px;margin:4px 0}
#info-overlay .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0a0a1a;color:#64B5F6;font-size:18px;z-index:100}
#controls-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(10,10,25,0.7);color:#888;padding:8px 20px;border-radius:20px;
  font-size:12px;z-index:10;backdrop-filter:blur(4px)}
.view-btn{background:rgba(100,181,246,0.12);border:1px solid rgba(100,181,246,0.25);
  color:#64B5F6;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;margin:4px 4px 0 0;
  transition:all 0.2s}
.view-btn:hover{background:rgba(100,181,246,0.28);border-color:rgba(100,181,246,0.5)}
.view-btn.active{background:rgba(100,181,246,0.35);color:#fff}
.btn-group{margin-top:8px;border-top:1px solid rgba(255,255,255,0.08);padding-top:8px}
</style>
</head>
<body>
<div id="loading">正在加载实景渲染...</div>
<div id="canvas-container"></div>
<div id="info-overlay" style="display:none">
  <h2>混合沙盘 C方案</h2>
  <div style="margin-bottom:8px;color:#888;font-size:11px">1.5m x 1.0m x 0.15m 三区一体化</div>
  <div class="zone"><span class="dot" style="background:#7B5E3A"></span><b>A区</b> 山区/滑坡 (坡度25-35°)</div>
  <div class="zone"><span class="dot" style="background:#1565C0"></span><b>B区</b> 河谷/洪水 (水位可控)</div>
  <div class="zone"><span class="dot" style="background:#2E7D32"></span><b>C区</b> 城镇/避难 (8栋建筑)</div>
  <div class="btn-group">
    <div style="margin-bottom:6px;color:#888;font-size:11px">视角</div>
    <button class="view-btn" onclick="setView('perspective')">透视</button>
    <button class="view-btn" onclick="setView('top')">俯视</button>
    <button class="view-btn" onclick="setView('side-a')">A区侧视</button>
    <button class="view-btn" onclick="setView('side-c')">C区侧视</button>
  </div>
  <div class="btn-group">
    <div style="margin-bottom:6px;color:#888;font-size:11px">灾害模拟</div>
    <button class="view-btn" onclick="toggleWater()" id="water-btn">水位: 正常</button>
    <button class="view-btn" onclick="toggleLandslide()" id="landslide-btn">滑坡: 原位</button>
    <button class="view-btn" onclick="toggleRain()" id="rain-btn">降雨: 关闭</button>
  </div>
  <div class="btn-group">
    <div style="margin-bottom:6px;color:#888;font-size:11px">时段</div>
    <button class="view-btn active" onclick="setTime('day')" id="time-day">白天</button>
    <button class="view-btn" onclick="setTime('sunset')" id="time-sunset">黄昏</button>
    <button class="view-btn" onclick="setTime('night')" id="time-night">夜晚</button>
  </div>
</div>
<div id="controls-hint">鼠标拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

      var r, g, b;

      if (x < A_END) {
        var ridgeN = fbm(x * 30, z * 30, 4);
        if (h > 0.18) {
          r = 245; g = 250; b = 252;
        } else if (h > 0.12) {
          r = 130 + n * 30; g = 120 + n * 25; b = 115 + n * 20;
        } else if (h > 0.06) {
          r = 95 + n * 35 + ridgeN * 20; g = 82 + n * 30; b = 60 + n * 20;
        } else if (h > 0.02) {
          r = 80 + n * 30; g = 85 + n * 35; b = 55 + n * 20;
        } else {
          r = 70 + n * 25; g = 65 + n * 20; b = 48 + n * 15;
        }
      } else if (x < B_END) {
        if (h < 0.003) {
          r = 35 + n * 15; g = 55 + n * 20; b = 80 + n * 25;
        } else if (h < 0.012) {
          r = 120 + n * 30; g = 115 + n * 25; b = 85 + n * 20;
        } else if (h < 0.02) {
          r = 140 + n * 25; g = 135 + n * 25; b = 95 + n * 15;
        } else {
          r = 100 + n * 30; g = 95 + n * 25; b = 70 + n * 15;
        }
      } else {
        var urbanN = fbm(x * 50, z * 50, 3);
        r = 105 + urbanN * 25; g = 100 + urbanN * 22; b = 85 + urbanN * 18;
        if (n > 0.65) { r += 15; g += 12; b += 8; }
      }
      var idx = (py * c.width + px) * 4;
      ctx.fillStyle = 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
      ctx.fillRect(px, py, 1, 1);
    }
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

function createWaterNormal() {
  var c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  var ctx = c.getContext('2d');
  var img = ctx.createImageData(256, 256);
  for (var py = 0; py < 256; py++) {
    for (var px = 0; px < 256; px++) {
      var u = px / 256, v = py / 256;
      var nx = fbm(u * 4, v * 4, 3);
      var ny = fbm(u * 4 + 100, v * 4 + 100, 3);
      var idx = (py * 256 + px) * 4;
      img.data[idx] = (128 + nx * 127) | 0;
      img.data[idx+1] = (128 + ny * 127) | 0;
      img.data[idx+2] = 255;
      img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}

function createBuildingTexture(type) {
  var c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  var ctx = c.getContext('2d');
  if (type === 'public') {
    ctx.fillStyle = '#E8DCC8';
    ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#C0A078';
    for (var ry = 0; ry < 128; ry += 16) {
      for (var rx = 0; rx < 128; rx += 16) {
        if ((rx + ry) % 32 === 0) {
          ctx.fillStyle = '#D4B896';
        } else {
          ctx.fillStyle = '#C8A878';
        }
        ctx.fillRect(rx + 2, ry + 2, 12, 12);
      }
    }
    ctx.strokeStyle = '#A08858';
    ctx.lineWidth = 1;
    for (var i = 0; i <= 128; i += 16) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 128); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(128, i); ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#D4C5A8';
    ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#3A4A5A';
    for (var wy = 12; wy < 128; wy += 24) {
      for (var wx = 8; wx < 128; wx += 24) {
        ctx.fillRect(wx, wy, 14, 16);
        ctx.fillStyle = '#5A6A7A';
        ctx.fillRect(wx, wy, 14, 4);
        ctx.fillStyle = '#3A4A5A';
      }
    }
    ctx.strokeStyle = '#A89878';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(128, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 32); ctx.lineTo(128, 32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 64); ctx.lineTo(128, 64); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(128, 96); ctx.stroke();
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function createSkyTexture(mode) {
  var c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  var ctx = c.getContext('2d');
  var grad = ctx.createLinearGradient(0, 0, 0, 512);
  if (mode === 'day') {
    grad.addColorStop(0, '#4878C8');
    grad.addColorStop(0.4, '#7AA8E8');
    grad.addColorStop(0.7, '#B0D0F0');
    grad.addColorStop(1, '#D8E8F8');
  } else if (mode === 'sunset') {
    grad.addColorStop(0, '#1A2848');
    grad.addColorStop(0.25, '#683860');
    grad.addColorStop(0.5, '#D8603A');
    grad.addColorStop(0.75, '#F0A050');
    grad.addColorStop(1, '#F8D890');
  } else {
    grad.addColorStop(0, '#050818');
    grad.addColorStop(0.4, '#0A1230');
    grad.addColorStop(0.7, '#101840');
    grad.addColorStop(1, '#182050');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 512);

  if (mode === 'day') {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (var i = 0; i < 15; i++) {
      var cx = Math.random() * 1024;
      var cy = Math.random() * 200;
      var cs = 40 + Math.random() * 60;
      ctx.beginPath();
      ctx.arc(cx, cy, cs, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (mode === 'night') {
    ctx.fillStyle = '#FFF';
    for (var i = 0; i < 180; i++) {
      var sx = Math.random() * 1024;
      var sy = Math.random() * 400;
      var ss = Math.random() < 0.1 ? 2.5 : 1;
      ctx.beginPath();
      ctx.arc(sx, sy, ss, 0, Math.PI * 2);
      ctx.fill();
    }
    var mx = 760, my = 100, mr = 28;
    var mgrad = ctx.createRadialGradient(mx, my, 2, mx, my, mr);
    mgrad.addColorStop(0, 'rgba(245,245,230,0.95)');
    mgrad.addColorStop(0.7, 'rgba(200,200,180,0.3)');
    mgrad.addColorStop(1, 'rgba(200,200,180,0)');
    ctx.fillStyle = mgrad;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#F5F5E0';
    ctx.beginPath();
    ctx.arc(mx, my, mr * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function getHeight(ix, iy) {
  return TERRAIN_META.heights[iy * TERRAIN_META.nx + ix] * EXAG;
}

function sampleHeight(x, y) {
  var nx = TERRAIN_META.nx, ny = TERRAIN_META.ny;
  var fx = (x / TERRAIN_META.width) * (nx - 1);
  var fy = (y / TERRAIN_META.depth) * (ny - 1);
  var ix = Math.round(fx), iy = Math.round(fy);
  ix = Math.max(0, Math.min(nx - 1, ix));
  iy = Math.max(0, Math.min(ny - 1, iy));
  return getHeight(ix, iy);
}

// ============================================================
// 初始化场景
// ============================================================
function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x3a4a6a, 2.5, 6.5);
  scene.background = createSkyTexture('day');

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 30);
  camera.position.set(1.8, 1.4, 1.6);
  camera.lookAt(0.75, 0, 0.5);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0.75, 0, 0.5);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.5;
  controls.maxDistance = 5.0;
  controls.maxPolarAngle = Math.PI * 0.48;

  setupLights();
  buildSky();
  buildTerrain();
  buildWater();
  buildLandslide();
  buildBuildings();
  buildRoads();
  buildTrees();
  buildRocks();
  buildBase();
  buildZoneMarkers();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('info-overlay').style.display = 'block';
  animate();
}

function setupLights() {
  ambLight = new THREE.AmbientLight(0x5a6a8a, 0.40);
  scene.add(ambLight);

  hemiLight = new THREE.HemisphereLight(0x88AACC, 0x4a3a2a, 0.50);
  hemiLight.position.set(0, 2, 0);
  scene.add(hemiLight);

  sunLight = new THREE.DirectionalLight(0xfff4d0, 1.3);
  sunLight.position.set(1.5, 2.5, 1.0);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 0.1;
  sunLight.shadow.camera.far = 6;
  sunLight.shadow.camera.left = -1;
  sunLight.shadow.camera.right = 2;
  sunLight.shadow.camera.top = 1.5;
  sunLight.shadow.camera.bottom = -0.5;
  sunLight.shadow.bias = -0.0005;
  scene.add(sunLight);

  fillLight = new THREE.DirectionalLight(0x6080bb, 0.30);
  fillLight.position.set(-1.5, 1.0, -0.5);
  scene.add(fillLight);
}

function buildSky() {
  var geo = new THREE.SphereGeometry(15, 32, 16);
  var mat = new THREE.MeshBasicMaterial({
    map: createSkyTexture('day'),
    side: THREE.BackSide,
    fog: false
  });
  skyMesh = new THREE.Mesh(geo, mat);
  scene.add(skyMesh);
}

function buildTerrain() {
  var nx = TERRAIN_META.nx, ny = TERRAIN_META.ny;
  var W = TERRAIN_META.width, D = TERRAIN_META.depth;

  var geo = new THREE.PlaneGeometry(W, D, nx - 1, ny - 1);
  geo.rotateX(-Math.PI / 2);

  var pos = geo.attributes.position;
  for (var i = 0; i < pos.count; i++) {
    var ix = i % nx;
    var iy = Math.floor(i / nx);
    pos.setY(i, getHeight(ix, iy));
  }
  geo.computeVertexNormals();

  var tex = createTerrainTexture();
  var mat = new THREE.MeshStandardMaterial({
    map: tex,
    roughness: 0.88,
    metalness: 0.0
  });

  var mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

function buildWater() {
  var geo = new THREE.PlaneGeometry(0.5, 1.0, 32, 64);
  geo.rotateX(-Math.PI / 2);

  var normalTex = createWaterNormal();
  var mat = new THREE.MeshStandardMaterial({
    color: 0x1A5080,
    transparent: true,
    opacity: 0.78,
    roughness: 0.08,
    metalness: 0.35,
    normalMap: normalTex,
    normalScale: new THREE.Vector2(0.8, 0.8),
    side: THREE.DoubleSide
  });

  waterMesh = new THREE.Mesh(geo, mat);
  waterMesh.position.set(0.85, WATER_LEVEL * EXAG, 0.5);
  waterMesh.receiveShadow = true;
  scene.add(waterMesh);
}

function buildLandslide() {
  var group = new THREE.Group();

  var mainGeo = new THREE.BoxGeometry(0.15, 0.04, 0.20);
  var n = 8;
  var pos = mainGeo.attributes.position;
  for (var i = 0; i < pos.count; i++) {
    if (pos.getY(i) > 0) {
      pos.setY(i, pos.getY(i) + (Math.random() - 0.3) * 0.015);
    }
    pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * 0.012);
    pos.setZ(i, pos.getZ(i) + (Math.random() - 0.5) * 0.012);
  }
  mainGeo.computeVertexNormals();

  var mat = new THREE.MeshStandardMaterial({
    color: 0x7B4A2A,
    roughness: 0.95,
    metalness: 0.0,
    flatShading: true
  });
  landslideMesh = new THREE.Mesh(mainGeo, mat);
  var baseZ = sampleHeight(0.3, 0.55);
  landslideMesh.position.set(0.3, baseZ + 0.022, 0.55);
  landslideMesh.castShadow = true;
  landslideMesh.receiveShadow = true;
  group.add(landslideMesh);

  for (var j = 0; j < 5; j++) {
    var s = 0.02 + Math.random() * 0.03;
    var rg = new THREE.DodecahedronGeometry(s, 0);
    var rm = new THREE.MeshStandardMaterial({
      color: 0x8B5A35 + Math.floor(Math.random() * 0x222222),
      roughness: 0.9,
      flatShading: true
    });
    var rock = new THREE.Mesh(rg, rm);
    var rx = (Math.random() - 0.5) * 0.14;
    var rz = (Math.random() - 0.5) * 0.18;
    rock.position.set(rx, 0.02 + Math.random() * 0.015, rz);
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    rock.castShadow = true;
    group.add(rock);
  }

  group.position.set(0.3, baseZ, 0.55);
  scene.add(group);
  landslideMesh.userData.group = group;

  var railGeo = new THREE.BoxGeometry(0.16, 0.001, 0.003);
  var railMat = new THREE.MeshBasicMaterial({color: 0x444444});
  var rail = new THREE.Mesh(railGeo, railMat);
  rail.position.set(0.3, baseZ + 0.001, 0.55);
  scene.add(rail);
}

function buildBuildings() {
  var resTex = createBuildingTexture('residential');
  var pubTex = createBuildingTexture('public');

  for (var i = 0; i < BUILDINGS.length; i++) {
    var b = BUILDINGS[i];
    var cx = b[0], cy = b[1], w = b[2], d = b[3], h = b[4], type = b[5];
    var baseZ = sampleHeight(cx, cy);

    var geo = new THREE.BoxGeometry(w, h, d);
    var tex = type === 'public' ? pubTex.clone() : resTex.clone();
    tex.needsUpdate = true;
    tex.repeat.set(2, 2);
    var mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.72,
      metalness: 0.05
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(cx, baseZ + h / 2, cy);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    var roofGeo = new THREE.ConeGeometry(Math.max(w, d) * 0.75, h * 0.45, 4);
    var roofMat = new THREE.MeshStandardMaterial({
      color: type === 'public' ? 0xB8483A : 0x5A3A2A,
      roughness: 0.85
    });
    var roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.set(cx, baseZ + h + h * 0.225, cy);
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    scene.add(roof);
  }
}

function buildRoads() {
  for (var i = 0; i < ROADS.length; i++) {
    var r = ROADS[i];
    var x1=r[0], y1=r[1], x2=r[2], y2=r[3], rw=r[4];
    var len = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
    var geo = new THREE.PlaneGeometry(len, rw);
    geo.rotateX(-Math.PI / 2);
    var mat = new THREE.MeshStandardMaterial({
      color: 0x2A2A2C,
      roughness: 0.92,
      metalness: 0.0
    });
    var mesh = new THREE.Mesh(geo, mat);
    var mx = (x1+x2)/2, my = (y1+y2)/2;
    var z1 = sampleHeight(mx, my) + 0.002;
    mesh.position.set(mx, z1, my);
    mesh.rotation.y = Math.atan2(y2-y1, x2-x1) * -1;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
}

function buildTrees() {
  var pinePositions = [];
  for (var i = 0; i < 30; i++) {
    var x = Math.random() * 0.55;
    var z = Math.random() * 1.0;
    var h = sampleHeight(x, z) / EXAG;
    if (h > 0.02 && h < 0.18) {
      pinePositions.push([x, z]);
    }
  }
  for (var i = 0; i < pinePositions.length; i++) {
    var p = pinePositions[i];
    addPineTree(p[0], p[1]);
  }

  var broadleafPositions = [];
  for (var i = 0; i < 8; i++) {
    var x = 0.6 + Math.random() * 0.45;
    var z = Math.random() * 1.0;
    var h = sampleHeight(x, z) / EXAG;
    if (h > 0.005 && h < 0.03) {
      broadleafPositions.push([x, z]);
    }
  }
  for (var i = 0; i < broadleafPositions.length; i++) {
    var p = broadleafPositions[i];
    addBroadleafTree(p[0], p[1]);
  }

  for (var i = 0; i < 6; i++) {
    var x = 1.15 + Math.random() * 0.3;
    var z = Math.random() * 1.0;
    if (z < 0.05 || z > 0.95) continue;
    addUrbanTree(x, z);
  }
}

function addPineTree(x, z) {
  var baseZ = sampleHeight(x, z);
  var scale = 0.7 + Math.random() * 0.5;

  var trunkGeo = new THREE.CylinderGeometry(0.003, 0.005, 0.02 * scale, 6);
  var trunkMat = new THREE.MeshStandardMaterial({color: 0x4A2A15, roughness: 0.9});
  var trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(x, baseZ + 0.01 * scale, z);
  trunk.castShadow = true;
  scene.add(trunk);

  var layers = 3;
  for (var i = 0; i < layers; i++) {
    var r = 0.025 * scale * (1 - i * 0.2);
    var h = 0.035 * scale;
    var coneGeo = new THREE.ConeGeometry(r, h, 6);
    var greenShade = 0x1A4A20 + Math.floor(Math.random() * 0x101010);
    var coneMat = new THREE.MeshStandardMaterial({color: greenShade, roughness: 0.85, flatShading: true});
    var cone = new THREE.Mesh(coneGeo, coneMat);
    cone.position.set(x, baseZ + (0.015 + i * 0.018) * scale, z);
    cone.castShadow = true;
    scene.add(cone);
  }
}

function addBroadleafTree(x, z) {
  var baseZ = sampleHeight(x, z);
  var scale = 0.8 + Math.random() * 0.4;

  var trunkGeo = new THREE.CylinderGeometry(0.004, 0.006, 0.025 * scale, 6);
  var trunkMat = new THREE.MeshStandardMaterial({color: 0x5A3520, roughness: 0.9});
  var trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(x, baseZ + 0.012 * scale, z);
  trunk.castShadow = true;
  scene.add(trunk);

  var numBlobs = 3 + Math.floor(Math.random() * 2);
  for (var i = 0; i < numBlobs; i++) {
    var r = (0.018 + Math.random() * 0.01) * scale;
    var blobGeo = new THREE.IcosahedronGeometry(r, 0);
    var green = 0x2A5A30 + Math.floor(Math.random() * 0x151515);
    var blobMat = new THREE.MeshStandardMaterial({color: green, roughness: 0.8, flatShading: true});
    var blob = new THREE.Mesh(blobGeo, blobMat);
    var ox = (Math.random() - 0.5) * 0.012;
    var oy = (0.022 + Math.random() * 0.012) * scale;
    var oz = (Math.random() - 0.5) * 0.012;
    blob.position.set(x + ox, baseZ + oy, z + oz);
    blob.castShadow = true;
    scene.add(blob);
  }
}

function addUrbanTree(x, z) {
  var baseZ = sampleHeight(x, z);
  var scale = 0.6 + Math.random() * 0.3;

  var trunkGeo = new THREE.CylinderGeometry(0.003, 0.004, 0.015 * scale, 6);
  var trunkMat = new THREE.MeshStandardMaterial({color: 0x6A4530, roughness: 0.85});
  var trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(x, baseZ + 0.007 * scale, z);
  trunk.castShadow = true;
  scene.add(trunk);

  var r = 0.016 * scale;
  var ballGeo = new THREE.IcosahedronGeometry(r, 0);
  var green = 0x3A6A40 + Math.floor(Math.random() * 0x080808);
  var ballMat = new THREE.MeshStandardMaterial({color: green, roughness: 0.8, flatShading: true});
  var ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.set(x, baseZ + 0.015 * scale, z);
  ball.castShadow = true;
  scene.add(ball);
}

function buildRocks() {
  for (var i = 0; i < 20; i++) {
    var x = Math.random() * 0.55;
    var z = Math.random() * 1.0;
    var h = sampleHeight(x, z) / EXAG;
    if (h < 0.04 || h > 0.16) continue;

    var baseZ = sampleHeight(x, z);
    var s = 0.008 + Math.random() * 0.02;
    var geo = new THREE.DodecahedronGeometry(s, 0);
    var p = geo.attributes.position;
    for (var j = 0; j < p.count; j++) {
      p.setX(j, p.getX(j) + (Math.random() - 0.5) * s * 0.4);
      p.setY(j, p.getY(j) + (Math.random() - 0.5) * s * 0.4);
      p.setZ(j, p.getZ(j) + (Math.random() - 0.5) * s * 0.4);
    }
    geo.computeVertexNormals();

    var grey = 0x606060 + Math.floor(Math.random() * 0x101010);
    var mat = new THREE.MeshStandardMaterial({
      color: grey,
      roughness: 0.92,
      metalness: 0.0,
      flatShading: true
    });
    var rock = new THREE.Mesh(geo, mat);
    rock.position.set(x, baseZ + s * 0.3, z);
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }

  for (var i = 0; i < 8; i++) {
    var x = 0.55 + Math.random() * 0.5;
    var z = Math.random() * 1.0;
    var h = sampleHeight(x, z) / EXAG;
    if (h < 0.01 || h > 0.025) continue;
    var baseZ = sampleHeight(x, z);
    var s = 0.006 + Math.random() * 0.012;
    var geo = new THREE.DodecahedronGeometry(s, 0);
    var mat = new THREE.MeshStandardMaterial({
      color: 0x7A6A58,
      roughness: 0.9,
      flatShading: true
    });
    var rock = new THREE.Mesh(geo, mat);
    rock.position.set(x, baseZ + s * 0.3, z);
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    rock.castShadow = true;

  }
}

function buildBase() {
  var W = TERRAIN_META.width, D = TERRAIN_META.depth;
  var baseGeo = new THREE.BoxGeometry(W + 0.04, 0.02, D + 0.04);
  var baseMat = new THREE.MeshStandardMaterial({
    color: 0x222228,
    roughness: 0.9,
    metalness: 0.1
  });
  var base = new THREE.Mesh(baseGeo, baseMat);
  base.position.set(W / 2, -0.015, D / 2);
  base.receiveShadow = true;
  scene.add(base);

  var frameMat = new THREE.MeshStandardMaterial({color: 0x15151a, roughness: 0.85, metalness: 0.2});
  var sides = [
    [W/2, 0, D+0.02, W+0.04, 0.06, 0.02],
    [W/2, 0, -0.02, W+0.04, 0.06, 0.02],
    [-0.02, 0, D/2, 0.02, 0.06, D+0.04],
    [W+0.02, 0, D/2, 0.02, 0.06, D+0.04]
  ];
  for (var i = 0; i < sides.length; i++) {
    var s = sides[i];
    var geo = new THREE.BoxGeometry(s[3], s[4], s[5]);
    var mesh = new THREE.Mesh(geo, frameMat);
    mesh.position.set(s[0], s[1]+0.03, s[2]);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
}

function buildZoneMarkers() {

}

function setView(view) {
  var targets = {
    perspective: {pos: [1.8, 1.4, 1.6], look: [0.75, 0, 0.5]},
    top: {pos: [0.75, 2.8, 0.5], look: [0.75, 0, 0.5]},
    'side-a': {pos: [-0.6, 0.7, 0.5], look: [0.3, 0.1, 0.5]},
    'side-c': {pos: [2.8, 0.7, 0.5], look: [1.3, 0.05, 0.5]}
  };
  var t = targets[view];
  if (!t) return;
  var startPos = camera.position.clone();
  var startLook = controls.target.clone();
  var endPos = new THREE.Vector3(t.pos[0], t.pos[1], t.pos[2]);
  var endLook = new THREE.Vector3(t.look[0], t.look[1], t.look[2]);
  var dur = 600, t0 = performance.now();
  function tween() {
    var k = Math.min(1, (performance.now() - t0) / dur);
    var e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    camera.position.lerpVectors(startPos, endPos, e);
    controls.target.lerpVectors(startLook, endLook, e);
    controls.update();
    if (k < 1) requestAnimationFrame(tween);
  }
  tween();
}

function toggleWater() {
  waterHigh = !waterHigh;
  var target = waterHigh ? 0.028 : WATER_LEVEL;
  var btn = document.getElementById('water-btn');
  btn.textContent = waterHigh ? '水位: 洪水位' : '水位: 正常';
  var start = waterMesh.position.y;
  var dur = 800, t0 = performance.now();
  function tween() {
    var k = Math.min(1, (performance.now() - t0) / dur);
    var e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    waterMesh.position.y = start + (target * EXAG - start) * e;
    if (k < 1) requestAnimationFrame(tween);
  }
  tween();
}

function toggleLandslide() {
  landslideSlid = !landslideSlid;
  var targetX = landslideSlid ? 0.45 : 0.3;
  var btn = document.getElementById('landslide-btn');
  btn.textContent = landslideSlid ? '滑坡: 已滑动' : '滑坡: 原位';
  var group = landslideMesh.userData.group;
  var start = group.position.x;
  var dur = 1000, t0 = performance.now();
  function tween() {
    var k = Math.min(1, (performance.now() - t0) / dur);
    var e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    group.position.x = start + (targetX - start) * e;
    var z = sampleHeight(group.position.x, group.position.z);
    group.position.y = z;
    if (k < 1) requestAnimationFrame(tween);
  }
  tween();
}
