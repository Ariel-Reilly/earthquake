services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: disasterguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disasterguard}
      POSTGRES_USER: ${POSTGRES_USER:-disasterguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME__dev_postgres_password_2026}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-disasterguard} -d ${POSTGRES_DB:-disasterguard}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: disasterguard-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        # ⚠️ 生产环境必须修改为强随机密码（长度 ≥ 16）。生成方式：openssl rand -base64 24
        "--requirepass",
        # 必须与下方 healthcheck 使用同一默认值，否则健康检查永久 NOAUTH 失败，
        # 进而导致 backend 的 depends_on: service_healthy 永久阻塞。
        "${REDIS_PASSWORD:-CHANGE_ME__dev_redis_password_2026}",
      ]
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME__dev_redis_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-13T11-37-09Z  # 锁版本避免静默升级
    container_name: disasterguard-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-disasterguard}
      # ⚠️ 生产环境必须修改为强随机密钥（长度 ≥ 24）。生成方式：openssl rand -base64 32
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME__dev_minio_password_24chars_minimum_2026}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MINIO_API_HOST_PORT:-127.0.0.1:19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-127.0.0.1:19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.9.0
    container_name: disasterguard-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_NODE_COOKIE: ${EMQX_NODE_COOKIE:-disasterguard-cookie}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      # ⚠️ 生产环境必须修改为强随机密码（长度 ≥ 16）。生成方式：openssl rand -base64 24
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-CHANGE_ME_emqx_secure_password_2024}
      # 启用内置数据库鉴权，并预置 disasterguard_backend 用户
      # EMQX 5.x 使用 Built-in Database 认证插件（auth.mnesia）
      EMQX_AUTH__MNESIA__PASSWORD_HASH: bcrypt
      # R3 P0-3：broker 侧凭据必须与 backend 服务（本文件下方）完全一致。
      # 此前本服务未传这两个变量，infra/emqx/init.sh 回退到自己的默认值
      # CHANGE_ME_EMQX_PASSWORD，与后端持有的密码不等 → MQTT 鉴权必然失败。
      # 两处必须引用同一个 ${EMQX_PASSWORD}，用户在 .env 设一次即可同步。
      EMQX_USERNAME: ${EMQX_USERNAME:-disasterguard_backend}
      EMQX_PASSWORD: ${EMQX_PASSWORD:-CHANGE_ME_emqx_secure_password_2024}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["bash", "/opt/emqx/data/config/init.sh"]
    ports:
      - "${EMQX_MQTT_HOST_PORT:-127.0.0.1:11883}:1883"
      - "${EMQX_MQTTS_HOST_PORT:-127.0.0.1:18883}:8883"
      - "${EMQX_WS_HOST_PORT:-127.0.0.1:18083}:8083"
      - "${EMQX_WSS_HOST_PORT:-127.0.0.1:18084}:8084"
      - "${EMQX_HTTP_HOST_PORT:-127.0.0.1:28083}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./infra/emqx:/opt/emqx/data/config:ro
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  tdengine:
    image: tdengine/tdengine:3.2.8.0  # 锁版本避免静默升级
    container_name: disasterguard-tdengine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${TDENGINE_TCP_HOST_PORT:-127.0.0.1:16030}:6030"
      - "${TDENGINE_HTTP_HOST_PORT:-127.0.0.1:16041}:6041"
    volumes:
      - tdengine_data:/var/lib/taos
      - tdengine_log:/var/log/taos
      - ./infra/tdengine/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # R5 P2-2：口令段跟随 backend 同源的 TDENGINE_PASSWORD（compose 插值，来自 .env），
      # 用户改 root 口令后 healthcheck 不再永久 unhealthy。默认 taosdata 与镜像一致。
      test: ["CMD-SHELL", "curl -sf http://localhost:6041/rest/login/root/${TDENGINE_PASSWORD:-taosdata}"]
      interval: 10s
      timeout: 5s
      # 保留 20 次重试（~200s）：首次拉起 + 初始化可能较慢，10 次会误判 unhealthy
      retries: 20

  backend:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: disasterguard-backend
    restart: unless-stopped
    working_dir: /app/backend
    command: mvn -q -DskipTests spring-boot:run
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${SERVER_PORT:-8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # ⚠️ JWT_SECRET 必须显式提供，**不存在**"application.yml 的 dev 默认值"——
      # application.yml 里是 `secret: ${JWT_SECRET:}`（空串兜底），而
      # JwtService#validate() 会拒绝空串/长度<32/弱密钥黑名单值，直接抛异常导致后端起不来。
      # compose 会自动读取根目录 .env 做 ${} 插值，因此本地开发只需在 .env 里放一个真密钥：
      #   openssl rand -base64 48
      # 这里用 :? 让缺失时在 compose 解析阶段就失败并给出这句提示，而不是等到容器里抛栈。
      JWT_SECRET: ${JWT_SECRET:?dev 环境需要在 .env 中设置 JWT_SECRET（生成：openssl rand -base64 48）；直接跑 start-dev 脚本会自动生成}
      # 过期时间用 ISO 8601 Duration（application.yml 读的是 JWT_EXPIRE）。
      # 原先这里写的是 JWT_EXPIRE_MINUTES，Java 侧无任何引用，是死配置（R4 顺带清理）。
      JWT_EXPIRE: ${JWT_EXPIRE:-PT2H}
      FILE_BASE_URL: ${FILE_BASE_URL:-http://localhost:19000}
      DEV_USERS_ENABLED: ${DEV_USERS_ENABLED:-false}
      DEVICE_AUTH_STRICT: ${DEVICE_AUTH_STRICT:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-disasterguard}
      POSTGRES_USER: ${POSTGRES_USER:-disasterguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME__dev_postgres_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ⚠️ 生产环境必须修改为强随机密码（长度 ≥ 16）。生成方式：openssl rand -base64 24
      # 默认值必须与上方 redis 服务 requirepass / healthcheck 的默认值完全一致，
      # 否则未设置 REDIS_PASSWORD 时后端鉴权失败（NOAUTH）。
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME__dev_redis_password_2026}
      # MinIO 凭证：Spring Boot 通过 minio.access-key / minio.secret-key 读取
      # 必须与上方 minio 服务的 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD 一致，
      # 否则后端连接 MinIO 时会被 403 拒绝。
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-disasterguard}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_ME__dev_minio_password_24chars_minimum_2026}
      # EMQX MQTT 鉴权（broker 侧用户名密码，需与 EMQX_DASHBOARD 配置的认证用户一致）
      EMQX_USERNAME: ${EMQX_USERNAME:-disasterguard_backend}
      # ⚠️ 生产环境必须修改为强随机密码（长度 ≥ 16）。生成方式：openssl rand -base64 24
      EMQX_PASSWORD: ${EMQX_PASSWORD:-CHANGE_ME_emqx_secure_password_2024}
      EMQX_ENABLED: ${EMQX_ENABLED:-true}
      EMQX_WS_PORT: ${EMQX_WS_PORT:-8083}
      EMQX_HTTP_PORT: ${EMQX_HTTP_PORT:-18083}
      TDENGINE_URL: ${TDENGINE_URL:-jdbc:TAOS-RS://tdengine:6041/disasterguard}
      TDENGINE_USERNAME: ${TDENGINE_USERNAME:-root}
      TDENGINE_PASSWORD: ${TDENGINE_PASSWORD:-taosdata}
      TDENGINE_ENABLED: ${TDENGINE_ENABLED:-false}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8001/api/ai}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_SCHEDULER_ENABLED: ${AI_SCHEDULER_ENABLED:-false}
      AI_FORECAST_HORIZON: ${AI_FORECAST_HORIZON:-7}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./:/app
      - m2_cache:/root/.m2
    ports:
      - "${BACKEND_HOST_PORT:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: disasterguard-ai
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 生产环境应配置为前端实际域名，禁止使用 "*"
      AI_CORS_ORIGINS: ${AI_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    volumes:
      - ./ai-service:/app
    ports:
      - "${AI_HOST_PORT:-127.0.0.1:8001}:8001"
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_USE_BACKEND: "true"
        # 生产部署时前端同域，API 通过 nginx 反向代理到 backend:8080
        VITE_API_BASE_URL: /api
        VITE_WS_URL: /ws
        VITE_REALTIME_POLL_INTERVAL: "15000"
        VITE_PERSONNEL_POLL_INTERVAL: "30000"
        VITE_TDT_TOKEN: ${VITE_TDT_TOKEN:-}
        VITE_TDT_ATTRIBUTION: ${VITE_TDT_ATTRIBUTION:-地图数据}
    image: disasterguard-frontend:latest
    container_name: disasterguard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-127.0.0.1:5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  emqx_data:
  emqx_log:
  tdengine_data:
  tdengine_log:
  m2_cache:
  node_modules:

networks:
  default:
    name: disasterguard-net
