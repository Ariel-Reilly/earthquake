server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ====== 安全响应头 ======
  # 生产环境建议开启 HSTS（首次配置后不要轻易关闭）
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  # 防止 XSS / 数据注入
  # 白名单只允许国内具备测绘资质的地图服务商（高德 / 天地图 / 中央气象台）。
  # 已移除 ArcGIS / Mapbox / OSM / Cesium Ion 等境外源，并修掉旧配置里
  # "https://*.t MapTile.amap.com" 的空格畸形 token（会导致整条 connect-src 被浏览器丢弃）。
  # 高德卫星影像瓦片域名是 *.is.autonavi.com，旧白名单只写 *.amap.com，瓦片会被 img-src 拦截。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.gaode.com https://*.is.autonavi.com https://webapi.amap.com https://restapi.amap.com https://t*.tianditu.gov.cn https://image.nmc.cn; connect-src 'self' https://*.amap.com https://*.is.autonavi.com https://webapi.amap.com https://restapi.amap.com https://*.tianditu.gov.cn https://image.nmc.cn; font-src 'self' data:; frame-ancestors 'self';" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # nginx 自身信息隐藏
  server_tokens off;

  # ====== AI 推理服务反向代理 ======
  # 前端多模态/模型漂移/卫星等能力需要直连 ai-service：后端 AiDeprecatedGapController
  # 对这些接口只返回 501，不做代理。此前前端兜底硬编码 http://localhost:8001/api/ai，
  # 生产镜像里浏览器会去请求用户本机的 8001 端口，链路必然断开。
  #
  # ⚠ 不能复用 /api/ai/ 前缀：后端 AiController / AiAnalysisController /
  #   AiDeprecatedGapController 已占用 /api/ai/**，会和下面的 /api/ 代理冲突。
  #   故使用独立前缀，由 VITE_AI_SERVICE_BASE=/ai-service/api/ai 注入。
  #
  # ⚠ 本代理只解决「可达性 + 同源」，不构成鉴权：ai-service 目前没有 JWT 校验，
  #   同源请求仍需由该服务自行校验网关凭据。上线前应补鉴权或把接口收回 Java 网关。
  location /ai-service/api/ai/ {
    proxy_pass http://ai-service:8001/api/ai/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI 推理 / 卫星合成耗时较长，放宽读写超时
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 50m;
  }

  # ====== API 反向代理 ======
  # 后端 API 请求转发到 backend 服务
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # presigned URL / 附件下载可能较大，加长超时
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 50m;
  }

  # ====== WebSocket 反向代理 ======
  location /ws {
    proxy_pass http://backend:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;  # WS 长连接保持 24h
    proxy_send_timeout 86400;
  }

  # ====== 前端静态资源 + SPA fallback ======
  location / {
    try_files $uri $uri/ /index.html;

    # 静态资源强缓存（Vite 构建产物带 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }
  }

  # ====== 健康检查 ======
  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
